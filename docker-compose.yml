services:
  nginx:
    image: nginx:latest  # Change from 'build' to 'image' to avoid Dockerfile conflicts
    container_name: nginx_container
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles_volume:/app/staticfiles:ro
    depends_on:
      - web
    networks:
      - app_network

  web:
    build: .
    container_name: django_container
    command: sh -c "python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app:delegated
      - staticfiles_volume:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEBUG=1
      # Override dotenv values as well as inherited Cloud SQL switches.
      - ACTIVE_DB=local
      - K_SERVICE=
      - USE_CLOUD_PROXY=false
      - CI=
      - SECRET_KEY=${SECRET_KEY:-local-development-only-change-me}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-replace_with_local_postgres_password}@db:5432/stayandtrek
      - POSTGRES_DB=stayandtrek
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-replace_with_local_postgres_password}
      - DB_HOST=db
      - DB_PORT=5432
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY:-}
      - CARTO_BASEMAP_API_KEY=${CARTO_BASEMAP_API_KEY:-}
    networks:
      - app_network

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    container_name: postgres_container
    platform: linux/amd64  # Use amd64 to work on your M1 Mac
    environment:
      POSTGRES_DB: stayandtrek
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_with_local_postgres_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stayandtrek"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5444:5432"
    networks:
      - app_network

volumes:
  postgres_data:
  staticfiles_volume:

networks:
  app_network:
    driver: bridge
